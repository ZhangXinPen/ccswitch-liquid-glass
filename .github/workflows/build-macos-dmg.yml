name: Build Release Packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name. If empty, a preview tag is generated."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows MSI
        run: pnpm tauri build --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } elseif ('${{ inputs.tag_name }}') { '${{ inputs.tag_name }}' } else { "preview-${{ github.run_number }}" }

          $msi = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -Include *.msi | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows MSI package was produced.'
          }
          Copy-Item $msi.FullName "release-assets/CC-Switch-$tag-Windows.msi"

          $exe = Get-ChildItem -Path 'src-tauri/target/release' -Filter 'cc-switch.exe' -File | Select-Object -First 1
          if ($null -eq $exe) {
            throw 'No Windows executable was produced.'
          }
          New-Item -ItemType Directory -Force -Path release-assets/CC-Switch-Portable | Out-Null
          Copy-Item $exe.FullName release-assets/CC-Switch-Portable/
          Set-Content -Path release-assets/CC-Switch-Portable/portable.ini -Value @(
            '# CC Switch portable build marker'
            'portable=true'
          ) -Encoding UTF8
          Compress-Archive -Path release-assets/CC-Switch-Portable/* -DestinationPath "release-assets/CC-Switch-$tag-Windows-Portable.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets/*

  build-macos-arm64:
    name: Build macOS ARM64 DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Prepare macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="preview-${{ github.run_number }}"
          fi

          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)"
          if [ -z "$dmg" ]; then
            echo "No macOS DMG package was produced." >&2
            exit 1
          fi
          cp "$dmg" "release-assets/CC-Switch-$tag-macOS-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-arm64
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - build-windows
      - build-macos-arm64

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="preview-${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CC Switch Liquid Glass ${{ steps.release.outputs.tag }}
          prerelease: true
          body: |
            ## CC Switch Liquid Glass ${{ steps.release.outputs.tag }}

            This build is a UI-focused fork based on the open-source project [farion1231/cc-switch](https://github.com/farion1231/cc-switch).

            ### Changes in this fork

            - Liquid Glass visual refresh for the main app shell, provider cards, toolbars, dialogs, dropdowns, and common controls.
            - Dedicated Liquid Glass tray popover for quick provider switching across Claude, Codex, and Gemini.
            - Overlay title bar and transparent tray popover window behavior.
            - GitHub Actions packaging for Windows and macOS ARM64 DMG.

            ### Downloads

            - Windows installer: `CC-Switch-${{ steps.release.outputs.tag }}-Windows.msi`
            - Windows portable build: `CC-Switch-${{ steps.release.outputs.tag }}-Windows-Portable.zip`
            - macOS Apple Silicon DMG: `CC-Switch-${{ steps.release.outputs.tag }}-macOS-arm64.dmg`

            ### 中文说明

            这是基于开源项目 [farion1231/cc-switch](https://github.com/farion1231/cc-switch) 修改的 UI 风格分支。本版本保留上游功能，并加入 Liquid Glass 视觉风格、托盘快速切换弹窗、overlay 标题栏和远端自动打包流程。

            本 Release 附带 Windows 安装版、Windows 绿色版和 macOS Apple Silicon DMG。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
